; ============================================================
; applytracker 配置文件
; 复制成 config.ini 再改。config.ini 里可能没有敏感信息，
; 但习惯上也不提交到仓库。
; ============================================================

[server]
; 本地看板端口。改这里的话，浏览器扩展那边也要跟着改
; （extension/background.js 里的 DEFAULT_PORT）
port = 8788

[output]
; 投递记录存在哪。CSV 可以直接用 Excel / WPS 打开改
dir = data
applications_csv = data/applications.csv
timezone_offset = 8

[notices]
; 「邮箱通知」标签页的数据从哪来。
;
;   feishu = 直接从飞书多维表格读（你已经有一套定时任务往飞书写通知的话，填上表的 token）
;   imap   = 本机直连自己的邮箱抓（推荐给只在本机用的同学，看 ADR-001）
;   file   = 读一个现成的 CSV
;   auto   = 配了 [mail] 的 user+authcode 就走邮箱，否则配了飞书表就走飞书，否则有 CSV 就 file
;   off    = 都不接（看板这一页给「怎么配」的提示，不报错）
source = auto

; 只在 source = file 时用；留空 = 自动到上级目录 / 本目录 data/ 找一份 notifications.csv
; （配套工具导出的那种），找不到就跳过、不影响看板其它功能。
; source = feishu / imap 时这里可以留空，同步下来的缓存会落在 data/notices.csv。
; 路径相对 applytracker.py 所在目录，也可以写绝对路径。
csv =

; ---- source = feishu 时填这三项 ----
; base_token：多维表格网址里 /base/ 后面那段
; table_id ：网址里 ?table= 后面那段
feishu_base_token =
feishu_table_id =

; 用哪个飞书身份去读。装了多个 lark-cli 账号档案时填档案名（lark-cli profile list 能看到）；
; 留空 = 用默认档案。
feishu_profile =

; 多久允许拉一次飞书，单位秒（默认 300 = 5 分钟）。
; lark-cli 每次调用要 2~5 秒，看板页面 10 秒轮一次，所以必须靠这个节流。
feishu_ttl = 300

[applications]
; 「投递进度」标签页：记录存在本地 data/applications.csv，也可以选跟飞书那张表同步 ——
; 你在表里把某条改成「待一面」，看板过一会儿自己就变了，不用再管导出导入。
;
;   source    = off（默认，只用本地 CSV）/ feishu（跟飞书表同步）/ auto（配了 token 就当 feishu）
;   feishu_ttl= 多久去飞书核对一次（秒）。看板小、一次只拉一两页，30 分钟足够。
;
; 默认 off：本地 CSV 是唯一真相源，新用户不填 token 也不会在启动时去连飞书。
; 想跟飞书同步再改成 feishu（或 auto），并把下面两项填上。
;
; 冲突规则：飞书那一格的值会抄进本地「飞书状态」列。下次同步时——
;   · 飞书那格变了   → 以飞书为准（状态、投递时间、备注一起跟上）
;   · 飞书那格没变   → 你在看板上手改的状态保留，不会被按回去
; 飞书表里没有的本地记录（扩展新记的、手动加的）原样留着，同步不会抹掉它们。
;
; 想手动拉一次：
;   python3 applytracker.py --apps-sync
; 老版本的一次性导入还留着（只加不更新，按「公司 + 岗位」判重）：
;   python3 applytracker.py --import-apps --dry-run
;
; 表里状态写法不用迁就本工具：已投递/待测评/待一面/已挂/OC!… 会自动翻成看板那 6 个状态；
; 状态是「未投递」的行不会被算成投递过，另存到 data/待投递.csv。
;
; base_token / table_id 从表格网址里取：/base/<base_token>?table=<table_id>
source = off
feishu_base_token =
feishu_table_id =
feishu_profile =
feishu_ttl = 1800

[opportunities]
; 「机会库」标签页：把一张校招/实习信息汇总表（企业 + 岗位 + 截止时间 + 投递入口）
; 搬到看板上，可以按行业 / 城市 / 批次筛，也能只看还没截止的。
;
;   feishu = 从飞书多维表格读（需要表里有一列公司名，以及截止时间/招聘岗位之类的列）
;   off    = 关掉这个标签页（默认）
;   auto   = 配了 token 就当 feishu，没配就是 off
source = off

; base_token：多维表格网址里 /base/ 后面那段；table_id：?table= 后面那段
feishu_base_token =
feishu_table_id =
feishu_profile =

; 这类汇总表往往几千上万条，全量拉一次要十几页、一分钟上下，所以 TTL 放长
; （默认 21600 = 6 小时）。服务一开着后台就有线程盯着这个 TTL，过期自己拉，
; 不用点开页面；想看最新的随时点页面上的「检查更新」或跑一次 --opps-sync。
feishu_ttl = 21600

[mail]
; 「邮箱通知」直连你自己的邮箱（IMAP）时用这一段。
;
; 最快的方式：在终端跑 `python3 applytracker.py --mail-config`，按提示填邮箱和授权码，
; 当场验登录、自动写回这个文件（并把文件权限收成 600）。不想连就整段不用管。
;
;   source   = auto（默认，填了 user+authcode 就会去连）/ imap / off（彻底不连）
;   host     = 邮箱服务商的 IMAP 地址：QQ imap.qq.com / 163 imap.163.com / Gmail imap.gmail.com
;   port     = 一般 993（SSL）
;   user     = 完整邮箱地址
;   authcode = 授权码（不是登录密码！去邮箱设置里单独开一个）；留空时读环境变量
;              APPLYTRACKER_MAIL_AUTHCODE
;   folder   = 收件箱文件夹名，一般是 INBOX
;   days_back= 每次回扫最近多少天（去重靠本地状态，不怕重叠）
;   only_unseen = true 只拉未读
;   ttl      = 后台自动拉的节流（秒）
source = auto
host = imap.qq.com
port = 993
user =
authcode =
folder = INBOX
days_back = 30
only_unseen = false
ttl = 900
