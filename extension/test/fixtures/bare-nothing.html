<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<title>招聘</title>
<style>body{margin:0;font:14px/1.7 "PingFang SC",sans-serif;padding:40px}
button{padding:8px 20px;border:none;background:#444;color:#fff;border-radius:4px}</style>
</head>
<body>
  <button id="apply">立即投递</button>
  <script>
    document.getElementById("apply").addEventListener("click", () => {
      const t = document.createElement("div");
      t.setAttribute("role", "alert");
      t.textContent = "投递成功";
      document.body.appendChild(t);
    });
  </script>
</body></html>
